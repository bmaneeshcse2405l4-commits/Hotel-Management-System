services:
  - type: web
    name: hotel-management
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-db
          property: connectionString
      - key: FLASK_ENV
        value: production

databases:
  - name: hotel-db
    databaseName: hotel_db
    user: hotel_user
    plan: free
